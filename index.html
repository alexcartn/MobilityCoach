<title>Supple Leopard</title>
<meta name="description" content="Coach de mobilité inspiré de Becoming a Supple Leopard : routines, tests et suivi, hors ligne.">
<meta id="theme-color" name="theme-color" content="#f5f1e8">
<script>
// Applique le thème enregistré avant le premier affichage (clair par défaut).
(function () {
  var t = 'light';
  try { var v = localStorage.getItem('sl-theme'); if (v === 'dark' || v === 'auto') t = v; } catch (e) {}
  document.documentElement.setAttribute('data-theme', t);
  var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.getElementById('theme-color').setAttribute('content', dark ? '#14110e' : '#f5f1e8');
})();
</script>
